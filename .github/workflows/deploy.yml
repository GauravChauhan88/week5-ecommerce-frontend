name: Deploy Vite React App to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js Environments
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        
      - name: Compile Production Build Matrix
        run: npm run build
        
             
      - name: Configure Cloud Pages Asset Settings
        uses: actions/configure-pages@v4
        
      - name: Upload Compiled Production Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Execute Live Deployment to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
